[project]
name = "wimsa-backend"
version = "0.1.0"
description = "Warehouse Inventory Management System w/ Analytics - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
wimsa-start = "app.main:start"
